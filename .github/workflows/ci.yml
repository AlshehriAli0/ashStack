name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Rules and helpers
        run: bun run test

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run check:fixtures
      - run: bun run check:smoke
      - run: bun run check:pack
      - run: bun run docs:rules:check

  # Opens a "Version Packages" PR collecting the pending changesets. Merging that
  # PR is what publishes: the same job runs again, finds no changesets, and ships
  # whatever version is not on the registry yet.
  release:
    needs: [test, check]
    if: github.repository == 'AlshehriAli0/ashStack' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm new enough to mint an OIDC token
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - name: Open the version PR, or publish once it is merged
        uses: changesets/action@v1
        with:
          version: bunx changeset version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
