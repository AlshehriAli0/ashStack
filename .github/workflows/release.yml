name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: How far to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      packages:
        description: What to publish
        type: choice
        options: [both, lint, fmt]
        default: both

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Full history and tags: the changelog is built from the commits since
      # the last tag, and a shallow checkout has neither.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm new enough to mint an OIDC token
        run: npm install -g npm@latest
      - run: bun install --frozen-lockfile

      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bun run format:check
      - run: bun run docs:rules:check

      - name: Bump the versions this release is asking for
        env:
          BUMP: ${{ inputs.bump }}
          PACKAGES: ${{ inputs.packages }}
        run: bun scripts/release-version.ts "$BUMP" "$PACKAGES"

      # release-notes.ts reads the bumped versions back out of the package.json
      # files and prints `name@version` per package, which is both the release
      # commit's subject and the tag to cut once the publish lands.
      - name: Write the notes and commit
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          summary=$(bun scripts/release-notes.ts "$PACKAGES")
          git add -A
          git commit -m "chore: release $summary"
          echo "RELEASED=$summary" >> "$GITHUB_ENV"

      # Tag after the publish, so a tag only ever exists for a version that
      # actually shipped. Push them together with the version commit.
      - name: Publish to npm, then tag what shipped
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          for pair in $RELEASED; do
            npm publish --workspace "${pair%@*}"
            git tag "$pair"
          done

      - name: Push the version commit and its tags
        run: git push --follow-tags

      - name: Cut a GitHub release per package, from its changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            pkg=${tag%@*}
            version=${tag##*@}
            dir=packages/${pkg#@ashstack/}
            awk -v v="$version" '/^## /{ inside = ($2 == v); next } inside' "$dir/CHANGELOG.md" > notes.md
            gh release create "$tag" --title "$tag" --notes-file notes.md
          done
